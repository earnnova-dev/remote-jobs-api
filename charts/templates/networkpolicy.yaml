{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "remote-jobs-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-jobs-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "remote-jobs-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
